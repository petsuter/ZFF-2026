<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zurich Film Festival - Movie Planner Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zff: {
                            gold: '#D4AF37',
                            'gold-hover': '#F3C623',
                            dark: '#121214',
                            card: '#1C1C21',
                            border: '#2E2E38',
                            accent: '#282833'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Firebase Realtime Database SDK (v9 Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0E0E10;
            color: #E2E8F0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121214;
        }
        ::-webkit-scrollbar-thumb {
            background: #2E2E38;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D4AF37;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF099 0%, #D4AF37 50%, #AA7C11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border-glow:focus {
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.4);
            border-color: #D4AF37;
        }

        .badge-gold {
            background: rgba(212, 175, 55, 0.15);
            color: #F3C623;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0E0E10] text-gray-200 antialiased selection:bg-zff-gold selection:text-black">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 bg-zff-dark/95 backdrop-blur-md border-b border-zff-border shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <!-- Brand Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-zff-gold via-yellow-500 to-amber-700 flex items-center justify-center text-black font-black text-xl shadow-lg shadow-zff-gold/20">
                    <i class="fa-solid font-black fa-film"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight gold-gradient-text">
                        ZFF MOVIE PLANNER
                    </h1>
                    <p class="text-xs text-gray-400 hidden sm:block">Zurich Film Festival Schedule & Ratings Dashboard</p>
                </div>
            </div>

            <!-- Action Controls in Header -->
            <div class="flex items-center gap-3">
                <!-- Favorites Toggle Quick Button -->
                <button id="navFavToggleBtn" onclick="toggleFavoritesFilter()" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-zff-card hover:bg-zff-accent border border-zff-border transition duration-200 text-sm font-medium text-gray-300">
                    <i id="navFavHeartIcon" class="fa-regular fa-heart text-rose-500 text-base"></i>
                    <span>Favorites</span>
                    <span id="favCounterBadge" class="ml-1 px-2 py-0.5 text-xs font-bold rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30">0</span>
                </button>

                <!-- CSV Upload Button -->
                <label for="csvFileInput" class="cursor-pointer flex items-center gap-2 px-3.5 py-2 rounded-xl bg-zff-gold hover:bg-zff-gold-hover text-black font-semibold text-sm transition duration-200 shadow-md shadow-zff-gold/10">
                    <i class="fa-solid fa-file-csv text-base"></i>
                    <span class="hidden md:inline">Upload CSV</span>
                </label>
                <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileUpload(event)">
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8">

        <!-- Filter Controls Sidebar -->
        <aside class="w-full lg:w-80 shrink-0 space-y-6">
            <div class="bg-zff-card rounded-2xl border border-zff-border p-5 shadow-2xl sticky top-28">
                <div class="flex items-center justify-between pb-4 border-b border-zff-border">
                    <h2 class="text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-zff-gold"></i> Filters & Sort
                    </h2>
                    <button onclick="resetAllFilters()" class="text-xs text-gray-400 hover:text-zff-gold transition">
                        Reset All
                    </button>
                </div>

                <div class="space-y-5 mt-5">
                    <!-- Text Search -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Search</label>
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                            <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Title, Director, Cast, Genre..." class="w-full bg-[#121215] border border-zff-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none gold-border-glow transition">
                        </div>
                    </div>

                    <!-- Sort By -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Sort By</label>
                        <select id="sortSelect" onchange="applyFilters()" class="w-full bg-[#121215] border border-zff-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none gold-border-glow transition">
                            <option value="rating_desc">IMDb Rating (High to Low)</option>
                            <option value="title_asc">Title (A - Z)</option>
                            <option value="screenings_desc">Most Screenings</option>
                            <option value="runtime_desc">Runtime (Longest First)</option>
                            <option value="runtime_asc">Runtime (Shortest First)</option>
                            <option value="total_likes">Likes</option>
                        </select>
                    </div>

                    <!-- Minimum IMDb Rating Slider -->
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="text-xs font-semibold uppercase tracking-wider text-gray-400">Min IMDb Rating</label>
                            <span id="ratingValDisplay" class="text-xs font-bold text-zff-gold bg-zff-gold/10 px-2 py-0.5 rounded border border-zff-gold/30">0.0+</span>
                        </div>
                        <input type="range" id="ratingSlider" min="0" max="10" step="0.5" value="0" oninput="updateRatingLabel(this.value); applyFilters();" class="w-full accent-zff-gold bg-[#121215] h-2 rounded-lg cursor-pointer">
                    </div>

                    <!-- Section Filter -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Section (Sektion)</label>
                        <select id="sectionSelect" onchange="applyFilters()" class="w-full bg-[#121215] border border-zff-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none gold-border-glow transition">
                            <option value="">All Sections</option>
                        </select>
                    </div>

                    <!-- Language Filter -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Language (Sprache)</label>
                        <select id="languageSelect" onchange="applyFilters()" class="w-full bg-[#121215] border border-zff-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none gold-border-glow transition">
                            <option value="">All Languages</option>
                        </select>
                    </div>

                    <!-- Subtitle Filter -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Subtitle (Untertitel)</label>
                        <select id="subtitleSelect" onchange="applyFilters()" class="w-full bg-[#121215] border border-zff-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none gold-border-glow transition">
                            <option value="">All Subtitles</option>
                        </select>
                    </div>

                    <!-- Checkbox Toggles -->
                    <div class="pt-2 border-t border-zff-border space-y-3">
                        <label class="flex items-center gap-3 text-sm font-medium text-gray-300 cursor-pointer">
                            <input type="checkbox" id="primeTimeToggle" onchange="applyFilters()" class="w-4 h-4 rounded accent-zff-gold border-zff-border bg-[#121215]">
                            <span>Evening / Prime Time Only</span>
                        </label>

                        <label class="flex items-center gap-3 text-sm font-medium text-gray-300 cursor-pointer">
                            <input type="checkbox" id="favOnlyToggle" onchange="syncFavToggleState(); applyFilters();" class="w-4 h-4 rounded accent-rose-500 border-zff-border bg-[#121215]">
                            <span class="flex items-center gap-1.5">
                                <i class="fa-solid fa-heart text-rose-500 text-xs"></i> Hearted Favorites Only
                            </span>
                        </label>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Movie Stream / Grid -->
        <section class="flex-1 min-w-0">
            <!-- Results Counter & Status Bar -->
            <div class="flex items-center justify-between mb-6 bg-zff-card px-5 py-3.5 rounded-2xl border border-zff-border shadow-md">
                <div class="text-sm font-medium text-gray-400">
                    Showing <span id="resultsCount" class="font-bold text-white">0</span> movies
                    <span id="dataStatusTag" class="ml-2 text-xs text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/20">Loading data...</span>
                </div>
                <div class="text-xs text-gray-500 flex items-center gap-2">
                    <span>Source:</span>
                    <span id="dataLoadedSource" class="font-semibold text-gray-300">movies.csv</span>
                </div>
            </div>

            <!-- Movie Cards Container -->
            <div id="movieGrid" class="space-y-5">
                <!-- Movie cards dynamically rendered here -->
            </div>

            <!-- Empty Results State -->
            <div id="emptyState" class="hidden text-center py-16 px-4 bg-zff-card rounded-2xl border border-dashed border-zff-border">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-zff-accent flex items-center justify-center text-gray-500 text-2xl">
                    <i class="fa-solid fa-film-slash"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-1">No movies match your criteria</h3>
                <p class="text-sm text-gray-400 max-w-sm mx-auto mb-6">Try relaxing your search terms or lowering your minimum IMDb rating threshold.</p>
                <button onclick="resetAllFilters()" class="px-4 py-2 rounded-xl bg-zff-gold hover:bg-zff-gold-hover text-black font-semibold text-sm transition">
                    Clear Filters
                </button>
            </div>
        </section>
    </main>

    <script>
        // Global State Variables
        let moviesData = [];
        let filteredData = [];
        let favorites = new Set(JSON.parse(localStorage.getItem('zff_favorites') || '[]'));
        let globalLikes = {};


        // Preloaded Fallback Demo Data (Used if movies.csv is missing or not served via server)
        const demoData = [
            {
                "Film": "Platzhalter",
                "Film Länge (Min)": "140",
                "Sektion": "Gala Premieren",
                "Sprache": "Russisch",
                "Untertitel": "de",
                "Screening Count": "2",
                "Has Evening/Weekend Screening": "Yes",
                "Screenings": "24.09.2026 17:30-19:55 @ Arthouse Le Paris | 26.09.2026 13:00-15:25 @ Corso 2",
                "IMDb Rating": "8.1",
                "IMDb Votes": "100",
                "Director": "Andrei Konchalovsky",
                "Stars": "Yulia Vysotskaya, Peter Kurth",
                "Genre": "Drama, History",
                "First Release Year": "2026",
                "Plot": "An epic historical drama focusing on the intricate lives and political struggles in Eastern Europe during the mid-20th century.",
                "Awards": "Nominated Venice Golden Lion",
                "IMDb Search Link": "https://www.imdb.com/find?q=HOPE&s=tt",
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            updateFavoritesCounter();
            loadDefaultCSV();
        });

        // Automatically fetch movies.csv from local directory or default back to demo
        function loadDefaultCSV() {
            fetch('movies.csv')
                .then(response => {
                    if (!response.ok) throw new Error('movies.csv not found directly');
                    return response.text();
                })
                .then(csvText => {
                    parseCSVData(csvText, 'movies.csv');
                    document.getElementById('dataStatusTag').textContent = 'Live CSV Loaded';
                    document.getElementById('dataStatusTag').className = 'ml-2 text-xs text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded border border-emerald-400/20';
                })
                .catch(err => {
                    console.log('Default movies.csv fetch fallback to demo data:', err);
                    moviesData = demoData;
                    document.getElementById('dataStatusTag').textContent = 'Demo Data (Upload CSV or run script)';
                    document.getElementById('dataLoadedSource').textContent = 'Demo Mode';
                    populateFilterDropdowns();
                    applyFilters();
                });
        }

        // File Input Handler for manual upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                parseCSVData(e.target.result, file.name);
                document.getElementById('dataStatusTag').textContent = 'Uploaded File';
                document.getElementById('dataStatusTag').className = 'ml-2 text-xs text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded border border-emerald-400/20';
                document.getElementById('dataLoadedSource').textContent = file.name;
            };
            reader.readAsText(file);
        }

        // Parse CSV string using PapaParse
        function parseCSVData(csvText, sourceName) {
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                dynamicTyping: false,
                complete: function(results) {
                    moviesData = results.data;
                    populateFilterDropdowns();
                    applyFilters();
                },
                error: function(err) {
                    alert('Error parsing CSV file: ' + err.message);
                }
            });
        }

        function populateFilterDropdowns() {
            const sections = new Set();
            const languages = new Set();
            const subtitles = new Set();

            moviesData.forEach(m => {
                if (m.Sektion) m.Sektion.split(',').forEach(s => sections.add(s.trim()));
                if (m.Sprache) m.Sprache.split(',').forEach(l => languages.add(l.trim()));
                if (m.Untertitel) m.Untertitel.split(',').forEach(u => subtitles.add(u.trim()));
            });

            populateSelect('sectionSelect', Array.from(sections).sort());
            populateSelect('languageSelect', Array.from(languages).sort());
            populateSelect('subtitleSelect', Array.from(subtitles).sort());
        }

        function populateSelect(elemId, items) {
            const select = document.getElementById(elemId);
            const firstOption = select.options[0];
            select.innerHTML = '';
            select.appendChild(firstOption);

            items.forEach(item => {
                if (!item || item === 'N/A') return;
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                select.appendChild(opt);
            });
        }

        function updateRatingLabel(val) {
            document.getElementById('ratingValDisplay').textContent = parseFloat(val).toFixed(1) + '+';
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortBy = document.getElementById('sortSelect').value;
            const minRating = parseFloat(document.getElementById('ratingSlider').value) || 0;
            const selectedSection = document.getElementById('sectionSelect').value;
            const selectedLang = document.getElementById('languageSelect').value;
            const selectedSub = document.getElementById('subtitleSelect').value;
            const primeTimeOnly = document.getElementById('primeTimeToggle').checked;
            const favOnly = document.getElementById('favOnlyToggle').checked;

            filteredData = moviesData.filter(movie => {
                // Hearted Favorites Filter
                if (favOnly && !favorites.has(movie.Film)) return false;

                // Minimum IMDb Rating Filter
                const rating = parseFloat(movie["IMDb Rating"]);
                if (!isNaN(rating) && rating < minRating) return false;
                if (isNaN(rating) && minRating > 0) return false;

                // Section Filter
                if (selectedSection && (!movie.Sektion || !movie.Sektion.includes(selectedSection))) return false;

                // Language Filter
                if (selectedLang && (!movie.Sprache || !movie.Sprache.includes(selectedLang))) return false;

                // Subtitle Filter
                if (selectedSub && (!movie.Untertitel || !movie.Untertitel.includes(selectedSub))) return false;

                // Prime Time Filter
                if (primeTimeOnly) {
                    const isPrime = movie["Prime Time Screening"] == '1' || movie["Prime Time Screening"] == 1 ||
                        (movie["Screenings"] && movie["Screenings"].split('|').some(s => {
                            const match = s.match(/\d{2}:\d{2}/);
                            return match && match[0] >= '18:00';
                        }));
                    if (!isPrime) return false;
                }

                // Text Search (Title, Director, Stars, Genre, Plot)
                if (searchTerm) {
                    const searchHaystack = [
                        movie.Film,
                        movie.Director,
                        movie.Stars,
                        movie.Genre,
                        movie["Plot"]
                    ].join(' ').toLowerCase();

                    if (!searchHaystack.includes(searchTerm)) return false;
                }

                return true;
            });

            // Sorting
            filteredData.sort((a, b) => {
                if (sortBy === 'rating_desc') {
                    const rA = parseFloat(a["IMDb Rating"]) || 0;
                    const rB = parseFloat(b["IMDb Rating"]) || 0;
                    return rB - rA;
                } else if (sortBy === 'title_asc') {
                    return (a.Film || '').localeCompare(b.Film || '');
                } else if (sortBy === 'screenings_desc') {
                    const sA = parseInt(a["Screening Count"]) || 0;
                    const sB = parseInt(b["Screening Count"]) || 0;
                    return sB - sA;
                } else if (sortBy === 'runtime_desc') {
                    const tA = parseInt(a["First Release Year"]) || 0;
                    const tB = parseInt(b["First Release Year"]) || 0;
                    return tB - tA;
                } else if (sortBy === 'runtime_asc') {
                    const tA = parseInt(a["First Release Year"]) || 0;
                    const tB = parseInt(b["First Release Year"]) || 0;
                    return tA - tB;
                } else if (sortBy === 'total_likes') {
                    const tA = globalLikes[getSafeKey(a.Film)] || 0;
                    const tB = globalLikes[getSafeKey(b.Film)] || 0;
                    return tB - tA;
                }
                return 0;
            });

            renderMovieCards();
        }

        function renderMovieCards() {
            const grid = document.getElementById('movieGrid');
            const emptyState = document.getElementById('emptyState');
            const countDisplay = document.getElementById('resultsCount');

            countDisplay.textContent = filteredData.length;

            if (filteredData.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            grid.innerHTML = filteredData.map((movie, index) => {
                const isFav = favorites.has(movie.Film);
                const totalLikes = globalLikes[getSafeKey(movie.Film)] || 0;
                const rating = movie["IMDb Rating"] && movie["IMDb Rating"] !== 'N/A' ? movie["IMDb Rating"] : null;
                const imdbUrl = `https://www.imdb.com/find?q=${encodeURIComponent(movie.Film)}&s=tt`;
                const zffUrl = `https://zff.com/en/movies/${encodeURIComponent(getSafeKey(movie.Film).toLowerCase())}`;

                // Screening list items
                const scheduleItems = (movie["Screenings"] || '')
                    .split('|')
                    .map(s => s.trim())
                    .filter(s => s.length > 0);

                return `
                <article class="bg-zff-card border border-zff-border hover:border-zff-gold/40 rounded-2xl p-5 md:p-6 transition duration-300 shadow-xl group">
                    <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
                        
                        <!-- Main Film Details -->
                        <div class="flex-1 min-w-0">
                            <!-- Title & Year Header -->
                            <div class="flex flex-wrap items-center gap-3 mb-2">
                                <h3 class="text-xl md:text-2xl font-bold text-white group-hover:text-zff-gold transition">
                                    ${escapeHtml(movie.Film)}
                                </h3>
                                ${movie["First Release Year"] && movie["First Release Year"] !== 'N/A' ? `
                                    <span class="text-xs px-2.5 py-1 rounded-full bg-zff-accent text-gray-400 font-semibold border border-zff-border">
                                        ${escapeHtml(movie["First Release Year"])}
                                    </span>
                                ` : ''}
                                ${movie["Film Länge (Min)"] ? `
                                    <span class="text-xs text-gray-400 flex items-center gap-1 font-medium">
                                        <i class="fa-regular fa-clock text-zff-gold"></i> ${escapeHtml(movie["Film Länge (Min)"])} min
                                    </span>
                                ` : ''}
                            </div>

                            <!-- Badges Row -->
                            <div class="flex flex-wrap items-center gap-2 mb-4">
                                ${rating ? `
                                    <span class="badge-gold px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
                                        <i class="fa-solid fa-star text-amber-400"></i> ${escapeHtml(rating)} / 10
                                    </span>
                                ` : ''}

                                ${movie.Sektion ? `
                                    <span class="px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                        ${escapeHtml(movie.Sektion)}
                                    </span>
                                ` : ''}

                                ${movie["Screening Count"] ? `
                                    <span class="px-2.5 py-1 rounded-lg text-xs font-medium bg-purple-500/10 text-purple-400 border border-purple-500/20">
                                        <i class="fa-solid fa-ticket text-xs mr-1"></i> ${escapeHtml(movie["Screening Count"])} Screenings
                                    </span>
                                ` : ''}
                            </div>

                            <!-- Director & Cast -->
                            <div class="space-y-1.5 text-xs text-gray-300 mb-4">
                                ${movie.Director && movie.Director !== 'N/A' ? `
                                    <p><strong class="text-gray-400">Director:</strong> ${escapeHtml(movie.Director)}</p>
                                ` : ''}
                                ${movie.Stars && movie.Stars !== 'N/A' ? `
                                    <p><strong class="text-gray-400">Cast:</strong> ${escapeHtml(movie.Stars)}</p>
                                ` : ''}
                                ${movie.Genre && movie.Genre !== 'N/A' ? `
                                    <p><strong class="text-gray-400">Genre:</strong> ${escapeHtml(movie.Genre)}</p>
                                ` : ''}
                            </div>

                            <!-- Plot Summary -->
                            ${movie["Plot"] && movie["Plot"] !== 'N/A' ? `
                                <p class="text-sm text-gray-400 line-clamp-2 hover:line-clamp-none transition-all duration-200 mb-4 bg-[#121215] p-3 rounded-xl border border-zff-border/50">
                                    ${escapeHtml(movie["Plot"])}
                                </p>
                            ` : ''}

                            <!-- Languages & Subtitles -->
                            <div class="flex flex-wrap items-center gap-4 text-xs text-gray-400 mb-4">
                                ${movie.Sprache ? `
                                    <span class="flex items-center gap-1"><i class="fa-solid fa-language text-zff-gold"></i> Audio: <strong class="text-gray-200">${escapeHtml(movie.Sprache)}</strong></span>
                                ` : ''}
                                ${movie.Untertitel ? `
                                    <span class="flex items-center gap-1"><i class="fa-solid fa-closed-captioning text-zff-gold"></i> Subs: <strong class="text-gray-200">${escapeHtml(movie.Untertitel)}</strong></span>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Right Action Buttons & Heart Favorite -->
                        <div class="flex md:flex-col items-center md:items-end justify-between shrink-0 gap-3">
                            <button onclick="toggleFavorite('${escapeQuotes(movie.Film)}')" class="p-3 rounded-xl border transition ${isFav ? 'bg-rose-500/20 text-rose-500 border-rose-500/40' : 'bg-zff-accent hover:bg-zff-border text-gray-400 border-zff-border'}" title="Toggle Favorite">
                                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart text-lg"></i>
                                <span style="font-size: 0.8rem;">(${totalLikes})</span>
                            </button>

                            <a href="${imdbUrl}" target="_blank" rel="noopener noreferrer" class="px-3 py-2 rounded-xl bg-zff-accent hover:bg-zff-border border border-zff-border text-xs text-gray-300 font-semibold flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-arrow-up-right-from-square text-zff-gold"></i> IMDb
                            </a>
                            <a href="${zffUrl}" target="_blank" rel="noopener noreferrer" class="px-3 py-2 rounded-xl bg-zff-accent hover:bg-zff-border border border-zff-border text-xs text-gray-300 font-semibold flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-arrow-up-right-from-square text-zff-gold"></i> ZFF
                            </a>
                        </div>
                    </div>

                    <!-- Expandable / Clean Schedule Breakdown -->
                    ${scheduleItems.length > 0 ? `
                        <div class="mt-4 pt-4 border-t border-zff-border/80">
                            <details class="group/sched">
                                <summary class="cursor-pointer text-xs font-semibold text-zff-gold flex items-center justify-between select-none">
                                    <span class="flex items-center gap-1.5">
                                        <i class="fa-regular fa-calendar-days"></i> Screening Schedule (${scheduleItems.length})
                                    </span>
                                    <span class="text-gray-500 group-open/sched:rotate-180 transition-transform">
                                        <i class="fa-solid fa-chevron-down"></i>
                                    </span>
                                </summary>
                                <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    ${scheduleItems.map(item => `
                                        <div class="bg-[#121215] px-3 py-2 rounded-xl border border-zff-border text-xs text-gray-300 flex items-center justify-between">
                                            <span>${escapeHtml(item)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </details>
                        </div>
                    ` : ''}
                </article>
                `;
            }).join('');
        }
        function getSafeKey(title) {
            return encodeURIComponent(title).replace(/\./g, '%2E');
        }
        function toggleFavorite(title) {
            const movieRef = db.ref('likes/' + getSafeKey(title));
            if (favorites.has(title)) {
                favorites.delete(title);
                movieRef.transaction(current => Math.max((current || 1) - 1, 0));
            } else {
                favorites.add(title);
                movieRef.transaction(current => (current || 0) + 1);
            }
            localStorage.setItem('zff_favorites', JSON.stringify(Array.from(favorites)));
            updateFavoritesCounter();
            applyFilters();
        }

        function updateFavoritesCounter() {
            document.getElementById('favCounterBadge').textContent = favorites.size;
        }

        function toggleFavoritesFilter() {
            const toggle = document.getElementById('favOnlyToggle');
            toggle.checked = !toggle.checked;
            syncFavToggleState();
            applyFilters();
        }

        function syncFavToggleState() {
            const isChecked = document.getElementById('favOnlyToggle').checked;
            const btn = document.getElementById('navFavToggleBtn');
            const icon = document.getElementById('navFavHeartIcon');

            if (isChecked) {
                btn.classList.add('border-rose-500/50', 'bg-rose-500/10');
                icon.className = 'fa-solid fa-heart text-rose-500 text-base';
            } else {
                btn.classList.remove('border-rose-500/50', 'bg-rose-500/10');
                icon.className = 'fa-regular fa-heart text-rose-500 text-base';
            }
        }

        function resetAllFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('sortSelect').value = 'rating_desc';
            document.getElementById('ratingSlider').value = 0;
            updateRatingLabel(0);
            document.getElementById('sectionSelect').value = '';
            document.getElementById('languageSelect').value = '';
            document.getElementById('subtitleSelect').value = '';
            document.getElementById('primeTimeToggle').checked = false;
            document.getElementById('favOnlyToggle').checked = false;
            syncFavToggleState();
            applyFilters();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&pt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeQuotes(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'");
        }
